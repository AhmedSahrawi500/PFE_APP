<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Shield/Emblem background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57f17;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield shape -->
  <path d="M100 8 L192 45 L192 115 Q192 170 100 212 Q8 170 8 115 L8 45 Z"
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Gold border / inner shield -->
  <path d="M100 18 L182 52 L182 115 Q182 164 100 203 Q18 164 18 115 L18 52 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Gold top banner -->
  <rect x="30" y="52" width="140" height="28" rx="4" fill="url(#goldGrad)" />

  <!-- ESTL text in banner -->
  <text x="100" y="72" font-family="Inter, Arial, sans-serif" font-size="20"
        font-weight="700" fill="#1a237e" text-anchor="middle" letter-spacing="3">
    ESTL
  </text>

  <!-- Book icon (open book) -->
  <g transform="translate(100, 108)">
    <!-- Left page -->
    <path d="M-28 -18 L-2 -14 L-2 18 L-28 14 Z"
          fill="none" stroke="#f9a825" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M28 -18 L2 -14 L2 18 L28 14 Z"
          fill="none" stroke="#f9a825" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Spine line -->
    <line x1="0" y1="-14" x2="0" y2="18" stroke="#f9a825" stroke-width="2.5"/>
    <!-- Lines on left page -->
    <line x1="-22" y1="-6" x2="-6" y2="-5" stroke="#f9a825" stroke-width="1.2" opacity="0.7"/>
    <line x1="-22" y1="0" x2="-6" y2="0" stroke="#f9a825" stroke-width="1.2" opacity="0.7"/>
    <line x1="-22" y1="6" x2="-6" y2="6" stroke="#f9a825" stroke-width="1.2" opacity="0.7"/>
    <!-- Lines on right page -->
    <line x1="6" y1="-5" x2="22" y2="-6" stroke="#f9a825" stroke-width="1.2" opacity="0.7"/>
    <line x1="6" y1="0" x2="22" y2="0" stroke="#f9a825" stroke-width="1.2" opacity="0.7"/>
    <line x1="6" y1="6" x2="22" y2="6" stroke="#f9a825" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Circuit/tech dots decoration -->
  <circle cx="55" cy="148" r="3" fill="#f9a825" opacity="0.6"/>
  <circle cx="145" cy="148" r="3" fill="#f9a825" opacity="0.6"/>
  <line x1="58" y1="148" x2="72" y2="148" stroke="#f9a825" stroke-width="1.5" opacity="0.4"/>
  <line x1="128" y1="148" x2="142" y2="148" stroke="#f9a825" stroke-width="1.5" opacity="0.4"/>

  <!-- Bottom text: full name -->
  <text x="100" y="168" font-family="Inter, Arial, sans-serif" font-size="7.5"
        font-weight="600" fill="#f9a825" text-anchor="middle" letter-spacing="0.5">
    ÉCOLE SUPÉRIEURE DE TECHNOLOGIE
  </text>
  <text x="100" y="180" font-family="Inter, Arial, sans-serif" font-size="8.5"
        font-weight="700" fill="#f9a825" text-anchor="middle" letter-spacing="1">
    DE LAÂYOUNE
  </text>

  <!-- Star decorations -->
  <text x="42" y="184" font-family="Arial" font-size="9" fill="#f9a825" opacity="0.7">★</text>
  <text x="151" y="184" font-family="Arial" font-size="9" fill="#f9a825" opacity="0.7">★</text>

  <!-- Founding year or tagline -->
  <text x="100" y="205" font-family="Inter, Arial, sans-serif" font-size="7"
        font-weight="400" fill="#bbdefb" text-anchor="middle" opacity="0.8">
    Université Ibn Tofail — Laâyoune
  </text>
</svg>
